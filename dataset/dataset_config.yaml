# Dataset Configuration for Architecture Diagram Detection
# Format: YOLO v8 compatible

path: ./dataset
train: splits/train.txt
val: splits/val.txt
test: splits/test.txt

# Classes - Architecture Components (consolidated from 30 to 10)
names:
  0: server
  1: database
  2: network
  3: storage
  4: security
  5: serverless
  6: queue
  7: monitoring
  8: user
  9: external

# Number of classes
nc: 10

# Metadata
metadata:
  version: "1.0.0"
  created: "2026-02-05"
  description: "Dataset for detecting architecture components in software diagrams"
  sources:
    - "AWS Architecture Icons"
    - "Azure Architecture Center"
    - "GCP Architecture Diagrams"
    - "Custom diagrams"
